aliases: [planning, task-planning, 需求拆解, 流程设计]
keywords: [plan, planning, workflow, roadmap, steps, acceptance criteria, 计划, 流程, 步骤, 需求拆解, 验收标准, 执行方案, 任务拆解]
keyword_weights: {plan: 0.8, planning: 0.8, workflow: 1.0, roadmap: 0.7, steps: 0.6, acceptance criteria: 0.8, 计划: 0.8, 流程: 0.8, 步骤: 0.6, 需求拆解: 1.0, 验收标准: 0.8, 执行方案: 1.0, 任务拆解: 1.0}
negative_keywords: [外卖, 歌曲]
