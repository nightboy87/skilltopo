[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skilltopo"
version = "0.2.1"
description = "Keyword-first skill routing and topology layer for file-based agent skill systems."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Emile Jiang" }]
maintainers = [{ name = "Emile Jiang" }]
keywords = ["agent", "skills", "routing", "skill-topology", "llm", "workflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.7.0"]
dev = ["pytest>=8.0", "ruff>=0.6.0", "build>=1.2.1"]

[project.urls]
Homepage = "https://github.com/nightboy87/skilltopo"
Repository = "https://github.com/nightboy87/skilltopo"
Issues = "https://github.com/nightboy87/skilltopo/issues"
Documentation = "https://github.com/nightboy87/skilltopo/tree/main/docs"

[project.scripts]
skilltopo = "skilltopo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
